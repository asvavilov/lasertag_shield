; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_resetmethod = nodemcu
lib_deps = arminjo/IRremote @ ^4.4.1
build_flags =
    -DMY_IR_SEND_PIN=2 # GPIO2 — IR LED
    -DMY_IR_RECV_PIN=3 # GPIO3 (RX) — IR receiver (только вход!)
# в этом случае (когда recv на RX) Serial можно использовать только в setup,
# до инициализации библиотек IRremote нужно вызвать `Serial.flush();` если он был инициализирован

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_resetmethod = nodemcu
lib_deps = arminjo/IRremote @ ^4.4.1
build_flags =
    -DMY_IR_SEND_PIN=4
    -DMY_IR_RECV_PIN=5

[env:lolin32_oled]
platform = espressif32
board = lolin32
framework = arduino
board_build.flash_mode = qio
lib_deps =
    arminjo/IRremote @ ^4.4.1
    https://github.com/ThingPulse/esp8266-oled-ssd1306.git#4.4.0
build_flags =
    -DMY_IR_SEND_PIN=13
    -DMY_IR_RECV_PIN=14
    -DHAS_OLED
    -DOLED_ADDR=0x3C
    -DOLED_SDA=5
    -DOLED_SCL=4
